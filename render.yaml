databases:
  - name: jobify-db
    databaseName: jobify_db
    user: jobify_user
    plan: free
    region: oregon

services:
  # Backend API
  - type: web
    name: jobify-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python init_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobify-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: TESSERACT_PATH
        value: /usr/bin/tesseract
      - key: ALLOWED_ORIGINS
        fromService:
          type: web
          name: jobify-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # Frontend
  - type: web
    name: jobify-frontend
    env: static
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jobify-backend
          envVarKey: RENDER_EXTERNAL_URL
